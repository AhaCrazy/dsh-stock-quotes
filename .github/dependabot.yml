# Dependency updates for dsh-stock-quotes.
#
# The plugin has zero runtime dependencies on purpose, so only the lint tooling
# and the workflow actions can move. Both are grouped into one pull request per
# ecosystem: reviewing a single bump bundle is cheaper than four one-line PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      lint-tooling:
        patterns:
          - '@eslint/*'
          - 'eslint*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
