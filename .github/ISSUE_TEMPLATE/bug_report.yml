name: Bug report
description: Something behaves incorrectly in the panel or the stock_quote tool. 面板或工具出问题时请用这个模板。
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. 感谢反馈。

        Please fill in the version fields — most quote problems turn out to be a
        mismatch between the plugin build and the DeepSeek Harness build.
        **Do not report security issues here** — see
        [SECURITY.md](https://github.com/AhaCrazy/dsh-stock-quotes/blob/main/SECURITY.md).
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: The `version` in `package.json`, or the npm version you installed. 插件版本。
      placeholder: '2.0.0'
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness version
      description: The DSH build you run the plugin in (e.g. its About panel). DSH 版本。
      placeholder: '0.2.x'
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: Where DeepSeek Harness is running. 运行 DSH 的系统。
      options:
        - Windows
        - macOS
        - Linux
        - Other / not sure
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Pick everything that applies. 可多选。
      multiple: true
      options:
        - Sidebar panel (行情面板)
        - stock_quote tool
        - Sparkline / focus chart
        - Search and symbol resolution
        - Settings, watchlists or import/export
        - Alerts / notifications
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact symbols, clicks and inputs. 尽量写清可复现的代码和操作。
      placeholder: |
        1. Open the panel and add `sh600519`
        2. Click the row to open the focus chart
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen. 你期望的结果。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead, including any error text. 实际结果和报错信息。
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Screenshots, console output or logs
      description: |
        Drag screenshots here. Paste browser-console errors or relevant Harness
        logs (redact anything private). 可拖入截图或粘贴控制台报错，注意隐去隐私信息。
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and this is not a duplicate. 我已搜索过 issue，确认不是重复问题。
          required: true
        - label: I can reproduce this with the latest plugin version. 我能在最新版插件上复现。
          required: true
